services:
  postgres:
    image: postgres:16-alpine
    container_name: study-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  minio:
    image: quay.io/minio/minio:latest
    container_name: production-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend_net

  backend:
    image: ${BACKEND_IMAGE:-study-report-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: study-report-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS}
      APP_ENV: ${APP_ENV}
      ENABLE_DOCS: ${ENABLE_DOCS}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      SITE_URL: ${SITE_URL}
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
      EXTERNAL_API_TIMEOUT_SECONDS: ${EXTERNAL_API_TIMEOUT_SECONDS}
      EXTERNAL_API_MAX_RETRIES: ${EXTERNAL_API_MAX_RETRIES}
      EXTERNAL_API_RATE_LIMIT_PER_MINUTE: ${EXTERNAL_API_RATE_LIMIT_PER_MINUTE}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - backend_net
      - edge_net

  frontend:
    image: ${FRONTEND_IMAGE:-study-report-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: study-report-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "5173:80"
    networks:
      - edge_net

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  backend_net:
    driver: bridge
  edge_net:
    driver: bridge
